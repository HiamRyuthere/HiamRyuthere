<svg xmlns="http://www.w3.org/2000/svg" width="360" height="122" viewBox="0 0 360 122" role="img" aria-label="Ephemeral Chat — Messages that exist only while you are in the room.">
<style>
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-90px); } }
  @keyframes glow { 0%,100% { opacity: .85; } 50% { opacity: 1; } }
  .f { animation: rise .6s cubic-bezier(.2,.7,.2,1) both; }
  @media (prefers-reduced-motion: no-preference) {
    .f { animation: rise .6s cubic-bezier(.2,.7,.2,1) both; }
    .f0 { animation-delay: .05s } .f1 { animation-delay: .15s } .f2 { animation-delay: .25s }
    .f3 { animation-delay: .35s } .f4 { animation-delay: .45s }
    .boat { animation: float 6s ease-in-out infinite; }
    .wave { animation: drift 26s linear infinite; }
    .sun { animation: glow 8s ease-in-out infinite; }
  }
</style>
<rect x="1" y="1" width="358" height="120" rx="10" fill="#1B1A13" stroke="#2A2A22"/>
<text x="16" y="28" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="8.5" fill="#E88B52" letter-spacing="1.6">02</text>
<text x="16" y="52" font-family="Georgia,'Iowan Old Style','Times New Roman',serif" font-size="18" fill="#F6F1E6">Ephemeral Chat</text>
<text x="16" y="70" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#AFA99A">Messages that exist only while you are in the room.</text>
<text x="16" y="92" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="8.5" fill="#69B78D" letter-spacing="1">Spring Boot · WebSocket</text>
