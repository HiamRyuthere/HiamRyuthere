<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="Harsh Parmar — backend developer in Java and Spring Boot, Indore">
<style>
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-90px); } }
  @keyframes glow { 0%,100% { opacity: .85; } 50% { opacity: 1; } }
  .f { animation: rise .6s cubic-bezier(.2,.7,.2,1) both; }
  @media (prefers-reduced-motion: no-preference) {
    .f { animation: rise .6s cubic-bezier(.2,.7,.2,1) both; }
    .f0 { animation-delay: .05s } .f1 { animation-delay: .15s } .f2 { animation-delay: .25s }
    .f3 { animation-delay: .35s } .f4 { animation-delay: .45s }
    .boat { animation: float 6s ease-in-out infinite; }
    .wave { animation: drift 26s linear infinite; }
    .sun { animation: glow 8s ease-in-out infinite; }
  }
</style>
